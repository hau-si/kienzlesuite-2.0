name: Release
# Ein Tag „core-v<version>“ baut das Release der Basis, ein Tag „<modul>-v<version>“ (z. B. sumup-v2.0.0) das eines Moduls
# (Archiv und Manifest) und veröffentlicht es auf GitHub. Die Signatur entsteht offline beim Herausgeber
# (docs/RELEASE-ABLAUF.md) und wird danach als .sig hochgeladen. Bis dahin installieren Server das Release nur mit
# abgeschalteter Signaturprüfung (Verwaltung → Updates).
on:
  push:
    tags: ['*-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Teil und Version prüfen
        run: |
          part="${GITHUB_REF_NAME%%-v*}"; version="${GITHUB_REF_NAME#"$part"-v}"
          if [ "$part" = core ]; then
            expected=$(cat core/VERSION); notes=docs/RELEASE.md; title="Basis $version"
          else
            [ -f "modules/$part/module.toml" ] && [ "$part" != beispiel ] || { echo "Unbekanntes Modul: $part"; exit 1; }
            expected=$(sed -nE 's/^version = "([^"]+)"$/\1/p' "modules/$part/module.toml" | head -1)
            notes="modules/$part/RELEASE.md"; title="Modul $part $version"
          fi
          [ "$version" = "$expected" ] || { echo "Tag $GITHUB_REF_NAME passt nicht zur Version $expected"; exit 1; }
          { echo "PART=$part"; echo "VERSION=$version"; echo "NOTES=$notes"; echo "TITLE=$title"; } >> "$GITHUB_ENV"
      - name: Tests
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-gd php-curl php-xml openssl librsvg2-bin poppler-utils qpdf fonts-dejavu-core ghostscript python3-openpyxl && bash tests/run-all.sh
      - name: Bauen
        run: |
          kanal=stabil; case "$VERSION" in *-*) kanal=beta ;; esac
          python3 -B scripts/release-bauen "$PART" --kanal "$kanal"
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=''; case "$VERSION" in *-*) pre='--prerelease' ;; esac
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' "$NOTES" > notizen.md
          printf '\n---\nNoch ohne Signatur: Signatur folgt vom Herausgeber (docs/RELEASE-ABLAUF.md).\n' >> notizen.md
          gh release create "$GITHUB_REF_NAME" dist/"$PART"-"$VERSION".tar.gz dist/"$PART"-"$VERSION".manifest.json --title "$TITLE" --notes-file notizen.md $pre
