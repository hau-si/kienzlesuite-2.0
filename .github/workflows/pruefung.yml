name: Prüfung
on:
  push:
    branches: [main, beta]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: python3 -m pip install --user --break-system-packages ruff
      - run: bash tests/run-all.sh
  # Gleiche Tests mit Python und Werkzeugen aus Ubuntu 26.04 (Zielplattform).
  ubuntu-26-04:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates python3 shellcheck
      - uses: actions/checkout@v4
      # Im Container läuft alles als root; die Tests prüfen Dateirechte trotzdem über die Modusbits.
      - run: bash tests/run-all.sh
