# Signatur: Dokumente (IGeL-Vertrag, Aufklärung, Datenschutz) am Unterschriftenpad unterschreiben lassen und als PDF
# in die T2med-Akte zurückschreiben. Stand dieser Fassung: Vorlagen und Vorgänge; Pad-Anbindung und Rückschreiben folgen.

[module]
id = "signatur"
name = "Signatur"
version = "0.1.0-beta.39"
core_api = "2"
description = "Verträge, Aufklärungen und Datenschutzerklärungen am Unterschriftenpad unterschreiben lassen, auch zeitversetzt, und als PDF in T2med ablegen."

[system]
packages = ["php-fpm", "php-cli", "php-curl", "php-sqlite3", "php-mbstring", "php-zip", "python3", "python3-pil", "fonts-dejavu-core"]
services = ["kienzle-signatur-pad.service"]
user = "ks-signatur"
data = "/var/lib/kienzle/signatur"

[web]
path = "/signatur"
upstream = "unix:/run/kienzle/signatur/web.sock"
protocol = "fastcgi"
entry = "public/index.php"
einstellungen = "/einstellungen"

[[rights]]
id = "vorgaenge"
label = "Signatur: Vorgänge anlegen, ansehen und abbrechen"

[[rights]]
id = "vorlagen"
label = "Signatur: Vorlagen und Vertragstexte ändern"

# Startkontext für den zentralen Arbeitsplatz-Starter der Basis (Verwaltung → Arbeitsplätze): POST https://<server>/starter/signatur
[[starters]]
schema = "praxisherz-signatur"
label = "Signatur"

[[exchange]]
module = "kasse"
purpose = "Unterschriebene PDFs von Vorgängen aus der Kasse an die Kasse geben; die Kasse legt sie in T2med ab"

[[connections]]
id = "t2med"
purpose = "Unterschriebenes PDF in die T2med-Akte schreiben (FHIR)"

[backup]
paths = ["/var/lib/kienzle/signatur"]

[setup]
overview = "bin/setup-overview"

[hooks]
install = "bin/install"
update = "bin/update"
remove = "bin/remove"
busy = "bin/busy"
health = "bin/health"
