# Telefon: Telefonanlage (Asterisk) mit Leitungen, Nebenstellen, Warteschlange und Faxkanal für das Modul fax.
# Auf Grundlage von Kienzlefax 3.5.0 und Kienzlefon 2.7 von Dr. Thomas Kienzle, für die Kienzle-Suite 2.0 als Modul umgebaut.
# Stufe 1: Anlage aus Kienzlefax. Sprachmenü, Transkription, Ansagen und KI aus Kienzlefon folgen (docs/PLAN-FAX-TELEFON.md).

[module]
id = "telefon"
name = "Telefon"
version = "0.1.0-beta.9"
core_api = "2"
description = "Telefonanlage: Leitungen der Anbieter, Telefone, Warteschlange, Sprachmenü (Kienzlefon) und Kanalgrenze. Stellt auch die Faxleitung für das Modul Fax bereit; Fax lässt sich erst danach installieren."

[system]
packages = ["asterisk", "asterisk-modules", "asterisk-prompt-de", "php-fpm", "php-cli", "php-mbstring", "python3", "python3-reportlab", "python3-pypdf", "python3-cryptography", "ghostscript", "qpdf", "libtiff-tools", "acl", "ffmpeg", "python3-venv", "espeak-ng", "libsndfile1", "libgomp1", "git"]
services = ["kienzle-telefon-asterisk.service", "kienzle-telefon-fax.service", "kienzle-telefon-pflege.service", "kienzle-telefon-pflege.timer", "kienzle-telefon-ansagen.service", "kienzle-telefon-ansagen.path"]
disables = ["asterisk.service"]
user = "ks-telefon"
data = "/var/lib/kienzle/telefon"

[web]
path = "/telefon"
upstream = "unix:/run/kienzle/telefon/web.sock"
protocol = "fastcgi"
entry = "public/index.php"
einstellungen = "/einstellungen"

[[firewall]]
name = "Telefon: Telefone der Praxis (SIP)"
port = 5060
proto = "udp"

[[firewall]]
name = "Telefon: Anbieter (SIP)"
port = 5070
proto = "udp"
scope = "any"

[[firewall]]
name = "Telefon: Sprache und Fax (RTP)"
port = "12000-12999"
proto = "udp"
scope = "any"

[[rights]]
id = "status"
label = "Telefon: Zustand der Anlage ansehen"

[[rights]]
id = "nebenstellen"
label = "Telefon: Namen der Telefone und Warteschlange ändern"

[[rights]]
id = "sprachmenue"
label = "Telefon: Zeiten, Ansagetexte und Menütasten des Sprachmenüs ändern"

[[exchange]]
module = "fax"
purpose = "Faxaufträge senden und empfangene Faxe übergeben (Format aus Kienzlefax)"

[backup]
paths = ["/var/lib/kienzle/telefon/anlage.json", "/var/lib/kienzle/telefon/ami.json"]
settings = ["/var/lib/kienzle/telefon/anlage.json"]

[setup]
overview = "bin/setup-overview"

[hooks]
install = "bin/install"
update = "bin/update"
remove = "bin/remove"
busy = "bin/busy"
health = "bin/health"
