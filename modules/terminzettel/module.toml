# Terminzettel: T2med-Terminblatt (virtueller Drucker „Terminzettel“) als Bon auf dem Bondrucker, mit Kalender-QR je Termin.
# Auf Grundlage von t2med-terminzettel 1.3.1 von Dr. Thomas Kienzle, für die Kienzle-Suite 2.0 als Modul umgebaut.

[module]
id = "terminzettel"
name = "Terminzettel"
version = "1.3.0-beta.2"
core_api = "1"
description = "Terminblatt aus T2med als Bon auf dem Bondrucker: virtueller Drucker „Terminzettel“, Layout mit Vorschau, Kalender-QR je Termin."

[system]
packages = ["php-fpm", "php-cli", "python3", "python3-pil", "python3-qrcode", "poppler-utils", "tesseract-ocr", "tesseract-ocr-deu", "ghostscript", "libgxps-utils", "fonts-dejavu-core", "cups-client"]
user = "ks-terminzettel"
data = "/var/lib/kienzle/terminzettel"

[web]
path = "/terminzettel"
upstream = "unix:/run/kienzle/terminzettel/web.sock"
protocol = "fastcgi"
entry = "public/index.php"
einstellungen = "/"

[[rights]]
id = "layout"
label = "Terminzettel: Layout, Texte und Kalender-QR ändern"

[[printers]]
name = "Terminzettel"
label = "T2med-Terminblatt als Bon (Terminzettel)"
command = "printer/kienzle-terminzettel"
formats = ["application/pdf", "application/postscript", "application/vnd.ms-xpsdocument", "text/plain", "application/octet-stream"]
paper = "A6"
share = ["samba", "ipp"]

[backup]
paths = ["/var/lib/kienzle/terminzettel"]
settings = ["/var/lib/kienzle/terminzettel/layout.json"]

[hooks]
install = "bin/install"
update = "bin/update"
remove = "bin/remove"
busy = "bin/busy"
health = "bin/health"
apparmor = ["gs"]
