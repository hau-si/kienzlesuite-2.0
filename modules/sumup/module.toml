# Kasse: Kartenzahlung am SumUp Solo aus T2med, T2med-Rechnungseingang, GOÄ-Leistungen, Barzahlung, Belege,
# Rechnung per Post (Letterxpress), Ablage für die Steuerberatung. Auf Grundlage von kienzle-sumup (Branch
# rechnungseingang, 1.4.1-rechnung.57) von Dr. Thomas Kienzle, für die Kienzle-Suite 2.0 umgebaut.

[module]
id = "sumup"
name = "Kasse"
version = "2.3.4-beta.8"
core_api = "1"
description = "Kartenzahlung am SumUp Solo aus T2med, T2med-Rechnungseingang über den Drucker „SumUp-Rechnung“, GOÄ-Leistungen, Barzahlung, Belege per E-Mail, Druck und Post."

[system]
packages = ["php-fpm", "php-cli", "php-curl", "php-sqlite3", "php-mbstring", "php-gd", "librsvg2-bin", "qpdf", "fonts-dejavu-core", "poppler-utils", "tesseract-ocr", "tesseract-ocr-deu", "ghostscript", "cups-client"]
user = "ks-sumup"
data = "/var/lib/kienzle/sumup"

[web]
path = "/kasse"
upstream = "unix:/run/kienzle/sumup/web.sock"
protocol = "fastcgi"
entry = "public/index.php"
# Arbeitsplatz-Starter aus T2med (kienzle-sumup://…): POST https://<server>/api.php mit dem Starter-Schlüssel.
starter = true
einstellungen = "/settings.php"

[[rights]]
id = "kassieren"
label = "Kasse: Kartenzahlung und Barzahlung aus T2med"

[[rights]]
id = "paid"
label = "Kasse: bezahlte T2med-Rechnungen abhaken"

[[rights]]
id = "inbox"
label = "Kasse: Rechnungseingang ansehen und Rechnungen löschen"

[[rights]]
id = "letter"
label = "Kasse: Rechnungen per Post (Letterxpress) senden"

[[rights]]
id = "catalog"
label = "Kasse: Leistungen und GOÄ-Positionen bearbeiten"

[[rights]]
id = "export"
label = "Kasse: Excel-Export für die Steuerberatung"

[backup]
paths = ["/var/lib/kienzle/sumup"]
snapshot = "bin/backup-snapshot"
settings = ["/var/lib/kienzle/sumup/grundwerte.json", "/var/lib/kienzle/sumup/sicherung"]

[[printers]]
name = "SumUp-Rechnung"
label = "T2med-Rechnung an die Kasse (Rechnungseingang)"
command = "printer/kienzle-sumup-rechnung"
formats = ["application/pdf", "application/postscript"]
paper = "A4"
share = ["samba", "ipp"]

[[connections]]
id = "t2med"
purpose = "Patient lesen und Zahlung in die Akte schreiben (FHIR)"

[[connections]]
id = "mail"
purpose = "Zahlungsbelege per E-Mail an Patienten senden"
required = false

[[connections]]
id = "letterxpress"
purpose = "Rechnungen per Post versenden"
required = false

[[connections]]
id = "ablage"
purpose = "Rechnungen als PDF für die Steuerberatung ablegen"
required = false

[setup]
overview = "bin/setup-overview"

[hooks]
install = "bin/install"
update = "bin/update"
remove = "bin/remove"
busy = "bin/busy"
health = "bin/health"
apparmor = ["gs", "qpdf"]
