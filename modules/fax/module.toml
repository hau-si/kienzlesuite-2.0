# Fax: Faxe senden über virtuelle Faxdrucker, Telefonbuch, Sendeprotokoll, Fehlerberichte und Faxeingang.
# Auf Grundlage von Kienzlefax 3.5.0 (kienzlefax.php) von Dr. Thomas Kienzle, für die Kienzle-Suite 2.0 als Modul umgebaut.
# Gesendet und empfangen wird über die Telefonanlage des Moduls telefon (gemeinsamer Austauschordner).

[module]
id = "fax"
name = "Fax"
version = "0.1.0-beta.5"
core_api = "2"
description = "Papierloses Fax: am PC auf einen Faxdrucker drucken, Empfänger wählen, senden; Sendeprotokoll, Fehlerberichte, Faxeingang. Braucht das Modul Telefon (Telefonanlage); eine Praxis nur mit Fax richtet dort nur die Faxleitung ein."
requires = ["telefon"]

[system]
packages = ["php-fpm", "php-cli", "php-sqlite3", "php-mbstring", "php-gd", "ghostscript"]
services = ["kienzle-fax-pflege.service", "kienzle-fax-pflege.timer"]
user = "ks-fax"
data = "/var/lib/kienzle/fax"

[web]
path = "/fax"
upstream = "unix:/run/kienzle/fax/web.sock"
protocol = "fastcgi"
entry = "public/index.php"
einstellungen = "/einstellungen"
uploads = true

[[rights]]
id = "senden"
label = "Fax: Faxe senden, Sendeprotokoll und Fehlerberichte"

[[rights]]
id = "eingang"
label = "Fax: Faxeingang lesen und löschen"

[[rights]]
id = "telefonbuch"
label = "Fax: Telefonbuch bearbeiten"

# Faxdrucker: ein Drucker „vFax“; weitere (vFax2, vFaxLabor …) trägt der Admin in den Einstellungen des Moduls ein. Das Modul schreibt die
# Namen nach drucker.json, die Basis legt sie beim Abgleichen an (Verwaltung → Drucker → „Virtuelle Drucker der Module abgleichen“).
[printer_list]
prefix = "vFax"
default = ["vFax"]
file = "drucker.json"
label = "Fax senden: Dokument erscheint im Modul Fax."
command = "printer/vfax"
formats = ["application/pdf", "application/postscript"]
paper = "A4"
share = ["ipp", "samba"]
max = 10

[[connections]]
id = "nachrichten"
purpose = "Kurze E-Mail bei neuem Faxeingang (ohne Absender und Inhalt)"
required = false

[[connections]]
id = "ablage"
purpose = "Empfangene Faxe auf dem NAS ablegen und Dateien zum Senden aus einem Lauschordner holen"
required = false

[[exchange]]
module = "telefon"
purpose = "Faxaufträge an die Telefonanlage geben und empfangene Faxe abholen (Format aus Kienzlefax)"

[backup]
paths = ["/var/lib/kienzle/fax"]
settings = ["/var/lib/kienzle/fax/einstellungen.json"]

[setup]
overview = "bin/setup-overview"

[hooks]
install = "bin/install"
update = "bin/update"
remove = "bin/remove"
busy = "bin/busy"
health = "bin/health"
apparmor = ["gs"]
