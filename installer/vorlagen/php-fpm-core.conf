; Kienzle-Suite, Basis: eigene php-fpm-Instanz als ks-core (nicht der php-fpm-Dienst der Distribution).
; Vom Installer geschrieben; Änderungen gehen beim nächsten Lauf verloren.
[global]
; Ins Systemprotokoll (journalctl -t kienzle-core-php). /proc/self/fd/2 lässt sich als ks-core nicht neu öffnen.
error_log = syslog
syslog.ident = kienzle-core-php
log_level = notice
daemonize = no

[core]
listen = /run/kienzle/core/web.sock
; Der Ordner /run/kienzle/core (0750, ks-core:www-data) lässt nur nginx hinein; daher darf der Socket 0666 sein.
listen.mode = 0666
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
pm.max_requests = 500
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
env[KIENZLE_CORE_CONFIG] = /etc/kienzle/core/core.json
env[PATH] = /usr/bin:/bin
php_admin_value[open_basedir] = /opt/kienzle/core/:/etc/kienzle/core/:/var/lib/kienzle/core/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,pcntl_exec,dl
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[file_uploads] = off
php_admin_flag[allow_url_fopen] = off
php_admin_value[post_max_size] = 1M
php_admin_value[max_execution_time] = 60
php_admin_value[memory_limit] = 128M
php_admin_value[session.auto_start] = 0
