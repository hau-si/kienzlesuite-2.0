# Kienzle-Suite: Samba nur als Druckserver für Windows-Arbeitsplätze (Vorlage der Basis; Module ändern diese Datei nicht).
# Dateifreigaben nur, wenn ein Modul einen Ordner anbietet ([[fileshare]]) und ein Admin ihn einschaltet. Nur SMB 3, kein NetBIOS. Erreichbar aus den Praxisnetzen nur, wenn die Firewall
# „Drucken über Windows-Freigabe (445)“ freigibt. Gastzugriff gilt nur für die Drucker; Modul-Ordner verlangen eine Anmeldung (Samba-Benutzer ks-<modul>).
# Freigegeben werden nur Warteschlangen, die in Verwaltung → Drucker dafür markiert sind (Datei wird erzeugt).
[global]
   # Arbeitsgruppe: Verwaltung → Drucker → Windows-Netz (Datei wird erzeugt).
   include = /etc/samba/kienzle-netz.conf
   server string = Kienzle-Suite
   server min protocol = SMB3
   client min protocol = SMB3
   smb ports = 445
   disable netbios = yes
   map to guest = Bad User
   guest account = nobody
   restrict anonymous = 0
   usershare max shares = 0
   load printers = no
   printing = cups
   printcap name = cups
   disable spoolss = no
   show add printer wizard = no
   smb encrypt = desired
   log level = 1
   logging = systemd
   max log size = 1000


include = /etc/samba/kienzle-drucker.conf
