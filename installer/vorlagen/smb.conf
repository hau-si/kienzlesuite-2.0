# Kienzle-Suite: Samba nur als Druckserver für Windows-Arbeitsplätze (Vorlage der Basis; Module ändern diese Datei nicht).
# Keine Dateifreigaben. Nur SMB 3, kein NetBIOS. Erreichbar aus den Praxisnetzen nur, wenn die Firewall
# „Drucken über Windows-Freigabe (445)“ freigibt. Gastzugriff gilt nur für die Drucker.
[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = Kienzle-Suite
   server min protocol = SMB3
   client min protocol = SMB3
   smb ports = 445
   disable netbios = yes
   map to guest = Bad User
   guest account = nobody
   restrict anonymous = 0
   usershare max shares = 0
   load printers = yes
   printing = cups
   printcap name = cups
   disable spoolss = no
   show add printer wizard = no
   smb encrypt = desired
   log level = 1
   logging = systemd
   max log size = 1000

[printers]
   comment = Drucker der Praxis
   path = /var/spool/samba
   printable = yes
   browseable = yes
   guest ok = yes
   read only = yes
   create mask = 0600
