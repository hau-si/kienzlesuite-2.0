# Start-ISO Praxisherz. Ubuntu Server 26.04.1 wird beim Start aus dem Netz geladen (@@ISO_URL@@);
# dafür braucht der Rechner Internet per DHCP und ca. 6 GB Arbeitsspeicher oder mehr.
# Feste Adresse für den Download: Eintrag mit „e“ bearbeiten und bei „ip=dhcp“ ersetzen durch
#   ip=ADRESSE::GATEWAY:NETZMASKE:praxisherz:ETHERNETNAME:off:DNSSERVER
set timeout=15
set default=0
loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Praxisherz installieren (stabil, signiert)" {
    set gfxpayload=keep
    linux /casper/vmlinuz ip=dhcp url=@@ISO_URL@@ autoinstall kienzle.kanal=stabil ---
    initrd /casper/initrd
}
menuentry "Praxisherz installieren (Beta, unsignierte Vorabversionen erlaubt)" {
    set gfxpayload=keep
    linux /casper/vmlinuz ip=dhcp url=@@ISO_URL@@ autoinstall kienzle.kanal=beta kienzle.unsigniert=1 ---
    initrd /casper/initrd
}
menuentry "Praxisherz installieren (Zweig main, unsigniert, nur wenn kein Release da ist)" {
    set gfxpayload=keep
    linux /casper/vmlinuz ip=dhcp url=@@ISO_URL@@ autoinstall kienzle.kanal=stabil kienzle.unsigniert=1 kienzle.zweig=main ---
    initrd /casper/initrd
}
menuentry "Praxisherz installieren (Zweig beta, unsigniert)" {
    set gfxpayload=keep
    linux /casper/vmlinuz ip=dhcp url=@@ISO_URL@@ autoinstall kienzle.kanal=beta kienzle.unsigniert=1 kienzle.zweig=beta ---
    initrd /casper/initrd
}
