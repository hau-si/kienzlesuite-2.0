set timeout=10
set default=0
loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Kienzle-Suite installieren (stabil, signiert)" {
    set gfxpayload=keep
    linux /casper/vmlinuz quiet autoinstall kienzle.kanal=stabil ---
    initrd /casper/initrd
}
menuentry "Kienzle-Suite installieren (Beta, unsignierte Vorabversionen erlaubt)" {
    set gfxpayload=keep
    linux /casper/vmlinuz quiet autoinstall kienzle.kanal=beta kienzle.unsigniert=1 ---
    initrd /casper/initrd
}
menuentry "Kienzle-Suite installieren (Zweig main, unsigniert, nur wenn kein Release da ist)" {
    set gfxpayload=keep
    linux /casper/vmlinuz quiet autoinstall kienzle.kanal=stabil kienzle.unsigniert=1 kienzle.zweig=main ---
    initrd /casper/initrd
}
menuentry "Kienzle-Suite installieren (Zweig beta, unsigniert)" {
    set gfxpayload=keep
    linux /casper/vmlinuz quiet autoinstall kienzle.kanal=beta kienzle.unsigniert=1 kienzle.zweig=beta ---
    initrd /casper/initrd
}
